name: Android APK

on:
  push:
    branches:
      - develop
      - feature/finance-mvp
      - feature/vira-1-ui
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Vira APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-provider: basic

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager nao encontrado em $SDK_ROOT"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Detect permanent signing key
        id: signing
        shell: bash
        env:
          FINTEST_KEYSTORE_BASE64: ${{ secrets.FINTEST_KEYSTORE_BASE64 }}
          FINTEST_KEYSTORE_PASSWORD: ${{ secrets.FINTEST_KEYSTORE_PASSWORD }}
          FINTEST_KEY_ALIAS: ${{ secrets.FINTEST_KEY_ALIAS }}
          FINTEST_KEY_PASSWORD: ${{ secrets.FINTEST_KEY_PASSWORD }}
        run: |
          if [ -n "$FINTEST_KEYSTORE_BASE64" ] &&              [ -n "$FINTEST_KEYSTORE_PASSWORD" ] &&              [ -n "$FINTEST_KEY_ALIAS" ] &&              [ -n "$FINTEST_KEY_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Assinatura permanente do Vira configurada."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Secrets de assinatura ainda nao configurados."
            echo "O workflow vai gerar apenas um APK debug temporario."
          fi

      - name: Decode permanent keystore
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          FINTEST_KEYSTORE_BASE64: ${{ secrets.FINTEST_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$FINTEST_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/FinTest-release.jks"
          chmod 600 "$RUNNER_TEMP/FinTest-release.jks"

      - name: Show build environment
        run: |
          java -version
          gradle --version

      - name: Verify Vira Alpha 01 structure
        if: github.ref == 'refs/heads/feature/vira-1-ui'
        run: bash scripts/verify-vira-alpha01.sh

      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          FINTEST_KEYSTORE_PATH: ${{ runner.temp }}/FinTest-release.jks
          FINTEST_KEYSTORE_PASSWORD: ${{ secrets.FINTEST_KEYSTORE_PASSWORD }}
          FINTEST_KEY_ALIAS: ${{ secrets.FINTEST_KEY_ALIAS }}
          FINTEST_KEY_PASSWORD: ${{ secrets.FINTEST_KEY_PASSWORD }}
        run: gradle --no-daemon clean assembleRelease

      - name: Build temporary debug APK
        if: steps.signing.outputs.enabled != 'true'
        run: gradle --no-daemon clean assembleDebug

      - name: Name APK with app version
        id: apk
        shell: bash
        env:
          SIGNED: ${{ steps.signing.outputs.enabled }}
        run: |
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"

          if [ -z "$VERSION_NAME" ]; then
            echo "Nao foi possivel identificar versionName."
            exit 1
          fi

          if [ "$SIGNED" = "true" ]; then
            SOURCE_APK="app/build/outputs/apk/release/app-release.apk"
            APK_NAME="Vira-v${VERSION_NAME}.apk"
          else
            SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
            APK_NAME="Vira-v${VERSION_NAME}-DEBUG-NAO-ATUALIZA.apk"
          fi

          APK_PATH="app/build/outputs/apk/${APK_NAME}"
          cp "$SOURCE_APK" "$APK_PATH"

          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

          echo "APK final: $APK_NAME"

      - name: Verify permanent signing certificate
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"

          "$APKSIGNER" verify --verbose --print-certs "${{ steps.apk.outputs.path }}" | tee "$RUNNER_TEMP/signature.txt"

          EXPECTED="846d6833750f2f511f7936c7a381de1f5ab28c53400213ac8d6144ae8fdf1757"
          ACTUAL="$(awk -F': ' '/certificate SHA-256 digest:/ {print $NF; exit}' "$RUNNER_TEMP/signature.txt" | tr '[:upper:]' '[:lower:]' | tr -d ':')"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Assinatura inesperada: $ACTUAL"
            exit 1
          fi

          echo "Assinatura permanente do Vira validada."

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
