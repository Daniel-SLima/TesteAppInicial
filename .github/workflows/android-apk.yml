name: Android APK

on:
  push:
    branches:
      - develop
      - feature/finance-mvp
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-provider: basic

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager nao encontrado em $SDK_ROOT"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Show build environment
        run: |
          java -version
          gradle --version

      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Name APK with app version
        id: apk
        shell: bash
        run: |
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"

          if [ -z "$VERSION_NAME" ]; then
            echo "Nao foi possivel identificar versionName."
            exit 1
          fi

          APK_NAME="FinTest-v${VERSION_NAME}.apk"
          APK_PATH="app/build/outputs/apk/debug/${APK_NAME}"

          cp app/build/outputs/apk/debug/app-debug.apk "$APK_PATH"

          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

          echo "APK final: $APK_NAME"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: FinTest-v${{ steps.apk.outputs.version }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
